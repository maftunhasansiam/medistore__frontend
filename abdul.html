<!DOCTYPE html>
<html lang="en">
<head>

<title>CodeMap — medistore__frontend</title>
<style>
:root {
  --bg: #0d0f14;
  --surface: #13161e;
  --surface2: #1a1e2a;
  --surface3: #222636;
  --border: #2a2f42;
  --border2: #353c55;
  --text: #e2e6f3;
  --text2: #8b93b0;
  --text3: #555f7a;
  --accent: #6c8aff;
  --accent2: #4a6cf7;
  --red: #ff5a6e;
  --red-dim: rgba(255,90,110,0.15);
  --green: #3dd68c;
  --green-dim: rgba(61,214,140,0.15);
  --blue: #5bb8ff;
  --blue-dim: rgba(91,184,255,0.15);
  --orange: #ff9442;
  --orange-dim: rgba(255,148,66,0.15);
  --warn: #ffca3a;
  --warn-dim: rgba(255,202,58,0.15);
  --radius: 10px;
  --card-w: 220px;
  --font: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ─────────────────────────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
}

#topbar .logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.3px;
  white-space: nowrap;
}
#topbar .logo span { color: var(--text2); font-weight: 400; font-size: 12px; margin-left: 6px; }

#search-wrap {
  position: relative;
  flex: 1;
  max-width: 280px;
}
#search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.4;
}
#search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  padding: 6px 10px 6px 32px;
  outline: none;
  font-family: var(--font);
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text3); }

.btn-group { display: flex; gap: 4px; }
.tb-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text2);
  font-size: 12px;
  padding: 5px 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: all .15s;
  font-family: var(--font);
}
.tb-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface3); }
.tb-btn.active { background: var(--accent2); border-color: var(--accent); color: #fff; }

.tb-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

.stat-chip {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
}
.stat-chip b { color: var(--text2); font-weight: 600; }

/* ── LEGEND ──────────────────────────────────────────── */
.legend {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text2);
}
.leg-dot {
  width: 20px;
  height: 2px;
  border-radius: 2px;
}

/* ── MAIN LAYOUT ─────────────────────────────────────── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
#sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width .2s;
}
#sidebar.collapsed { width: 0; }

.sidebar-section {
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  padding: 10px 14px 6px;
  font-weight: 600;
}

/* filters */
#ext-filters { padding: 6px 14px 10px; display: flex; flex-direction: column; gap: 4px; }
.ext-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
}
.ext-row input { accent-color: var(--accent); cursor: pointer; }
.ext-count {
  margin-left: auto;
  font-size: 10px;
  color: var(--text3);
  background: var(--surface2);
  border-radius: 4px;
  padding: 1px 5px;
}

/* file inspector */
#inspector { flex: 1; overflow-y: auto; padding: 10px 14px; }
#inspector-placeholder {
  font-size: 12px;
  color: var(--text3);
  text-align: center;
  margin-top: 20px;
}
.insp-filename {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  word-break: break-all;
  margin-bottom: 8px;
}
.insp-path {
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  margin-bottom: 12px;
  word-break: break-all;
}
.insp-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text2);
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.insp-row b { color: var(--text); }
.insp-section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text3);
  margin: 12px 0 5px;
  font-weight: 600;
}
.insp-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.insp-tag {
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
}
.insp-tag.red { background: var(--red-dim); color: var(--red); border-color: rgba(255,90,110,.3); }
.insp-tag.green { background: var(--green-dim); color: var(--green); border-color: rgba(61,214,140,.3); }
.insp-tag.blue { background: var(--blue-dim); color: var(--blue); border-color: rgba(91,184,255,.3); }
.insp-tag.warn { background: var(--warn-dim); color: var(--warn); border-color: rgba(255,202,58,.3); }

/* ── CANVAS AREA ─────────────────────────────────────── */
#canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: grab;
}
#canvas-wrap.grabbing { cursor: grabbing; }

#canvas {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
}

/* arrows SVG */
#arrows-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
}

/* ── CARDS ───────────────────────────────────────────── */
.card {
  position: absolute;
  width: var(--card-w);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
  transition: border-color .15s, box-shadow .15s, opacity .2s;
}
.card:hover {
  border-color: var(--border2);
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
}
.card.focused {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(108,138,255,.25);
  z-index: 10;
}
.card.dimmed {
  opacity: 0.18;
  pointer-events: none;
}
.card.orphan { border-color: rgba(255,148,66,.4); }
.card.dead-export { border-color: rgba(255,202,58,.35); }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-bottom: 6px;
}
.card-icon {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  font-family: var(--mono);
  flex-shrink: 0;
  letter-spacing: -0.3px;
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  word-break: break-all;
  line-height: 1.3;
}
.card-dir {
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 6px;
}
.badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  letter-spacing: .3px;
}
.badge-orphan { background: var(--orange-dim); color: var(--orange); }
.badge-dead { background: var(--warn-dim); color: var(--warn); }

.card-meta {
  margin-top: 6px;
  display: flex;
  gap: 8px;
  font-size: 10px;
  color: var(--text3);
}

/* Expanded card view */
.card.expanded {
  width: 300px;
  z-index: 20;
  border-color: var(--accent);
}
.card-expanded-body {
  display: none;
  margin-top: 8px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.card.expanded .card-expanded-body { display: block; }
.exp-section { margin-bottom: 8px; }
.exp-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  font-weight: 600;
  margin-bottom: 4px;
}
.exp-items { display: flex; flex-wrap: wrap; gap: 3px; }
.exp-item {
  font-size: 10px;
  font-family: var(--mono);
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
}

/* ── TOOLTIP / HOVER ─────────────────────────────────── */
#tooltip {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  pointer-events: none;
  z-index: 1000;
  display: none;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
  max-width: 220px;
}
.tt-name { font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 13px; }
.tt-row { display: flex; justify-content: space-between; gap: 16px; color: var(--text2); font-size: 11px; padding: 2px 0; }
.tt-row b { color: var(--text); }

/* ── MINIMAP ─────────────────────────────────────────── */
#minimap-wrap {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 180px;
  height: 120px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  z-index: 50;
}
#minimap {
  position: relative;
  width: 100%;
  height: 100%;
}
#minimap canvas { position: absolute; top: 0; left: 0; }
#minimap-viewport {
  position: absolute;
  border: 1.5px solid var(--accent);
  background: rgba(108,138,255,.08);
  pointer-events: none;
}

/* ── STATUS BAR ──────────────────────────────────────── */
#statusbar {
  height: 26px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  font-size: 11px;
  color: var(--text3);
  flex-shrink: 0;
}
#statusbar b { color: var(--text2); }
#status-msg { margin-left: auto; color: var(--text3); }

/* ── SCROLLBAR ───────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>

function buildExtFilters() {
  const counts = {};
  for (const n of nodes) {
    counts[n.ext] = (counts[n.ext] || 0) + 1;
    activeExts.add(n.ext);
  }

    row.innerHTML = `
      <input type="checkbox" checked data-ext="${ext}"/>
      <span style="color:${EXT_COLORS[ext]||'var(--text2)'}">${ext}</span>
      <span class="ext-count">${count}</span>
    `;
    row.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) activeExts.add(ext);
      else activeExts.delete(ext);
      renderCards();
      renderEdges();
      updateMinimap();
    });
    extFilters.appendChild(row);
  }
}

// ═══════════════════════════════════════════════════════
//  LAYOUT ALGORITHMS
// ═══════════════════════════════════════════════════════
const CARD_W = 220, CARD_H = 90, GAP = 60;

function applyLayout(type) {
  currentLayout = type;
  if (type === "grid") layoutGrid();
  else if (type === "tree") layoutTree();
  else layoutForce();
}

function layoutGrid() {
  const cols = Math.ceil(Math.sqrt(nodes.length * 1.5));
  nodes.forEach((n, i) => {
    positions[n.id] = {
      x: (i % cols) * (CARD_W + GAP) + 40,
      y: Math.floor(i / cols) * (CARD_H + GAP) + 40
    };
  });
}

function layoutTree() {
  // BFS from nodes with no incoming edges
  const inDeg = {};
  for (const n of nodes) inDeg[n.id] = 0;
  for (const e of edges) inDeg[e.to] = (inDeg[e.to] || 0) + 1;
  const roots = nodes.filter(n => inDeg[n.id] === 0);
  if (roots.length === 0) { layoutGrid(); return; }

  const visited = new Set();
  const levels = [];
  let queue = roots;
  while (queue.length > 0) {
    levels.push(queue);
    const next = [];
    for (const n of queue) {
      visited.add(n.id);
      const children = edges.filter(e => e.from === n.id).map(e => nodes.find(x => x.id === e.to)).filter(x => x && !visited.has(x.id));
      next.push(...children);
    }
    queue = [...new Set(next)];
  }
  // place unvisited
  const unvisited = nodes.filter(n => !visited.has(n.id));
  if (unvisited.length) levels.push(unvisited);

  levels.forEach((level, li) => {
    const totalW = level.length * (CARD_W + GAP);
    level.forEach((n, ni) => {
      positions[n.id] = {
        x: ni * (CARD_W + GAP) + 40,
        y: li * (CARD_H + 120) + 40
      };
    });
  });
}

function layoutForce() {
  // Simple force-directed init
  nodes.forEach((n, i) => {
    const angle = (i / nodes.length) * 2 * Math.PI;
    const r = Math.max(300, nodes.length * 40);
    positions[n.id] = {
      x: Math.cos(angle) * r + r + 100,
      y: Math.sin(angle) * r + r + 100
    };
  });

  // Run iterations
  const adj = {};
  for (const n of nodes) adj[n.id] = new Set();
  for (const e of edges) { adj[e.from].add(e.to); adj[e.to].add(e.from); }

  for (let iter = 0; iter < 200; iter++) {
    const forces = {};
    for (const n of nodes) forces[n.id] = { x: 0, y: 0 };

    // Repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = positions[a.id].x - positions[b.id].x;
        const dy = positions[a.id].y - positions[b.id].y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = 80000 / (dist * dist);
        forces[a.id].x += f * dx / dist;
        forces[a.id].y += f * dy / dist;
        forces[b.id].x -= f * dx / dist;
        forces[b.id].y -= f * dy / dist;
      }
    }

    // Attraction along edges
    for (const e of edges) {
      const a = positions[e.from], b = positions[e.to];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (dist - 280) * 0.03;
      forces[e.from].x += f * dx / dist;
      forces[e.from].y += f * dy / dist;
      forces[e.to].x -= f * dx / dist;
      forces[e.to].y -= f * dy / dist;
    }

    const damping = 1 - iter / 200;
    for (const n of nodes) {
      positions[n.id].x += forces[n.id].x * damping * 0.5;
      positions[n.id].y += forces[n.id].y * damping * 0.5;
      positions[n.id].x = Math.max(0, positions[n.id].x);
      positions[n.id].y = Math.max(0, positions[n.id].y);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  RENDER CARDS
// ═══════════════════════════════════════════════════════
function renderCards() {
  // Remove old cards
  document.querySelectorAll(".card").forEach(c => c.remove());

  for (const node of nodes) {
    if (!activeExts.has(node.ext)) continue;
    const pos = positions[node.id];
    if (!pos) continue;

    const card = document.createElement("div");
    card.className = "card" +
      (node.isOrphan ? " orphan" : "") +
      (node.hasUnusedExports ? " dead-export" : "");
    card.dataset.id = node.id;
    card.style.left = pos.x + "px";
    card.style.top = pos.y + "px";

    const extColor = EXT_COLORS[node.ext] || "#8b93b0";
    const importCount = edges.filter(e => e.to === node.id).length;
    const exportCount = edges.filter(e => e.from === node.id).length;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon" style="background:${extColor}22;color:${extColor}">${node.ext.replace(".","").toUpperCase().slice(0,3)}</div>
        <div>
          <div class="card-title">${node.name}</div>
          <div class="card-dir">${node.dir === "." ? "/" : node.dir}</div>
        </div>
      </div>
      <div class="card-meta">
        <span>${node.lines} lines</span>
        <span>${formatSize(node.size)}</span>
        <span>↓${importCount} ↑${exportCount}</span>
      </div>
      <div class="card-badges">
        ${node.isOrphan ? '<span class="badge badge-orphan">⬡ Orphan</span>' : ""}
        ${node.hasUnusedExports ? '<span class="badge badge-dead">⚠ Dead Export</span>' : ""}
      </div>
      <div class="card-expanded-body">
        ${renderExpandedBody(node)}
      </div>
    `;

    // Drag
    card.addEventListener("mousedown", e => startCardDrag(e, card, node.id));

    // Hover tooltip
    card.addEventListener("mouseenter", e => showTooltip(e, node));
    card.addEventListener("mouseleave", () => hideTooltip());
    card.addEventListener("mousemove", e => moveTooltip(e));

    // Click = focus + expand
    card.addEventListener("click", e => {
      e.stopPropagation();
      handleCardClick(node.id);
    });

    canvas.appendChild(card);
  }

  applyFocusState();
  applySearchFilter();
}

function renderExpandedBody(node) {
  const imp = node.imports.slice(0, 8);
  const exp = node.exports.slice(0, 8);
  const comp = node.components.slice(0, 8);
  return `
    ${imp.length ? `<div class="exp-section"><div class="exp-label">Imports</div><div class="exp-items">${imp.map(i=>`<span class="exp-item">${i.split("/").pop()}</span>`).join("")}</div></div>` : ""}
    ${exp.length ? `<div class="exp-section"><div class="exp-label">Exports</div><div class="exp-items">${exp.map(e=>`<span class="exp-item">${e}</span>`).join("")}</div></div>` : ""}
    ${comp.length ? `<div class="exp-section"><div class="exp-label">Components</div><div class="exp-items">${comp.map(c=>`<span class="exp-item">${c}</span>`).join("")}</div></div>` : ""}
  `;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + "B";
  return (bytes / 1024).toFixed(1) + "KB";
}

// ═══════════════════════════════════════════════════════
//  RENDER EDGES (SVG ARROWS)
// ═══════════════════════════════════════════════════════
const EDGE_COLORS = { import: "#ff5a6e", component: "#3dd68c", function: "#5bb8ff" };

function renderEdges() {
  svg.innerHTML = `
    <defs>
      <marker id="arr-import" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#ff5a6e" opacity="0.8"/>
      </marker>
      <marker id="arr-component" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#3dd68c" opacity="0.8"/>
      </marker>
      <marker id="arr-function" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#5bb8ff" opacity="0.8"/>
      </marker>
    </defs>
  `;

  for (const edge of edges) {
    const fromPos = positions[edge.from];
    const toPos = positions[edge.to];
    if (!fromPos || !toPos) continue;
    if (!activeExts.has(nodes.find(n => n.id === edge.from)?.ext)) continue;
    if (!activeExts.has(nodes.find(n => n.id === edge.to)?.ext)) continue;

    const x1 = fromPos.x + CARD_W / 2, y1 = fromPos.y + CARD_H / 2;
    const x2 = toPos.x + CARD_W / 2, y2 = toPos.y + CARD_H / 2;
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2 - 30;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`);
    path.setAttribute("stroke", EDGE_COLORS[edge.type]);
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("fill", "none");
    path.setAttribute("opacity", "0.45");
    path.setAttribute("marker-end", `url(#arr-${edge.type})`);
    path.dataset.from = edge.from;
    path.dataset.to = edge.to;
    path.classList.add("edge-path");
    svg.appendChild(path);
  }
}

// ═══════════════════════════════════════════════════════
//  FOCUS / DIM
// ═══════════════════════════════════════════════════════
function handleCardClick(id) {
  if (focusedId === id) {
    // Deselect
    focusedId = null;
    expandedId = null;
    clearInspector();
  } else {
    focusedId = id;
    expandedId = id;
    showInspector(nodes.find(n => n.id === id));
  }
  applyFocusState();
}

function applyFocusState() {
  const cards = document.querySelectorAll(".card");
  const edges = document.querySelectorAll(".edge-path");

  if (!focusedId) {
    cards.forEach(c => c.classList.remove("focused","dimmed"));
    edges.forEach(e => { e.style.opacity = "0.45"; });
    cards.forEach(c => {
      c.classList.remove("expanded");
    });
    return;
  }

  const connected = new Set([focusedId]);
  for (const e of GRAPH.edges) {
    if (e.from === focusedId) connected.add(e.to);
    if (e.to === focusedId) connected.add(e.from);
  }

  cards.forEach(c => {
    const id = c.dataset.id;
    c.classList.toggle("focused", id === focusedId);
    c.classList.toggle("dimmed", !connected.has(id));
    c.classList.toggle("expanded", id === expandedId);
  });

  edges.forEach(e => {
    const visible = connected.has(e.dataset.from) && connected.has(e.dataset.to);
    e.style.opacity = visible ? "0.75" : "0.05";
  });
}

// ═══════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════
function applySearchFilter() {
  const q = searchQuery.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll(".card").forEach(c => {
      c.style.outline = "";
      if (!c.classList.contains("dimmed")) c.style.opacity = "";
    });
    return;
  }
  document.querySelectorAll(".card").forEach(c => {
    const id = c.dataset.id;
    const match = id.toLowerCase().includes(q);
    c.style.outline = match ? "2px solid var(--accent)" : "";
    c.style.opacity = match ? "1" : "0.15";
  });
}

// ═══════════════════════════════════════════════════════
//  INSPECTOR PANEL
// ═══════════════════════════════════════════════════════
function showInspector(node) {
  if (!node) return;
  const importCount = GRAPH.edges.filter(e => e.to === node.id).length;
  const exportCount = GRAPH.edges.filter(e => e.from === node.id).length;
  inspector.innerHTML = `
    <div class="insp-filename">${node.name}</div>
    <div class="insp-path">${node.relativePath}</div>
    <div class="insp-row"><span>Lines</span><b>${node.lines}</b></div>
    <div class="insp-row"><span>Size</span><b>${formatSize(node.size)}</b></div>
    <div class="insp-row"><span>Imported by</span><b>${importCount}</b></div>
    <div class="insp-row"><span>Imports</span><b>${exportCount}</b></div>
    <div class="insp-row"><span>Orphan</span><b>${node.isOrphan ? "Yes ⬡" : "No"}</b></div>
    <div class="insp-row"><span>Dead exports</span><b>${node.hasUnusedExports ? "Yes ⚠" : "No"}</b></div>
    ${node.imports.length ? `
      <div class="insp-section-label">Imports</div>
      <div class="insp-list">${node.imports.map(i => `<span class="insp-tag red">${i.split("/").pop()}</span>`).join("")}</div>
    ` : ""}
    ${node.exports.length ? `
      <div class="insp-section-label">Exports</div>
      <div class="insp-list">${node.exports.map(e => `<span class="insp-tag green">${e}</span>`).join("")}</div>
    ` : ""}
    ${node.components.length ? `
      <div class="insp-section-label">Components Used</div>
      <div class="insp-list">${node.components.slice(0,12).map(c => `<span class="insp-tag blue">${c}</span>`).join("")}</div>
    ` : ""}
  `;
}

function clearInspector() {
  inspector.innerHTML = `<div id="inspector-placeholder">Click a card to inspect it</div>`;
}

// ═══════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════
function showTooltip(e, node) {
  const importCount = GRAPH.edges.filter(e => e.to === node.id).length;
  const exportCount = GRAPH.edges.filter(e => e.from === node.id).length;
  tooltip.innerHTML = `
    <div class="tt-name">${node.name}</div>
    <div class="tt-row"><span>Lines</span><b>${node.lines}</b></div>
    <div class="tt-row"><span>Size</span><b>${formatSize(node.size)}</b></div>
    <div class="tt-row"><span>Imports</span><b>${node.imports.length}</b></div>
    <div class="tt-row"><span>Exports</span><b>${node.exports.length}</b></div>
    <div class="tt-row"><span>Connected by</span><b>${importCount} files</b></div>
    <div class="tt-row"><span>Connects to</span><b>${exportCount} files</b></div>
  `;
  tooltip.style.display = "block";
  moveTooltip(e);
}

function moveTooltip(e) {
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + 230 > window.innerWidth) x = e.clientX - 234;
  if (y + 180 > window.innerHeight) y = e.clientY - 184;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

function hideTooltip() { tooltip.style.display = "none"; }

// ═══════════════════════════════════════════════════════
//  PAN & ZOOM
// ═══════════════════════════════════════════════════════
function setTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  updateMinimapViewport();
}

function fitView() {
  if (nodes.length === 0) return;
  const xs = nodes.map(n => positions[n.id]?.x || 0);
  const ys = nodes.map(n => positions[n.id]?.y || 0);
  const minX = Math.min(...xs), maxX = Math.max(...xs) + CARD_W;
  const minY = Math.min(...ys), maxY = Math.max(...ys) + CARD_H;
  const contentW = maxX - minX + 80, contentH = maxY - minY + 80;
  const ww = canvasWrap.clientWidth, wh = canvasWrap.clientHeight;
  scale = Math.min(ww / contentW, wh / contentH, 1);
  panX = (ww - contentW * scale) / 2 - minX * scale + 40 * scale;
  panY = (wh - contentH * scale) / 2 - minY * scale + 40 * scale;
  setTransform();
}

canvasWrap.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.min(Math.max(scale * delta, 0.08), 4);
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  setTransform();
}, { passive: false });

canvasWrap.addEventListener("mousedown", e => {
  if (e.target === canvasWrap || e.target === canvas || e.target === svg) {
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panOriginX = panX;
    panOriginY = panY;
    canvasWrap.classList.add("grabbing");

    // Click on canvas bg = deselect
    if (e.target === canvasWrap || e.target === canvas) {
      focusedId = null;
      expandedId = null;
      clearInspector();
      applyFocusState();
    }
  }
});

document.addEventListener("mousemove", e => {
  if (isPanning) {
    panX = panOriginX + (e.clientX - panStartX);
    panY = panOriginY + (e.clientY - panStartY);
    setTransform();
  }
  if (dragCard) {
    const rect = canvasWrap.getBoundingClientRect();
    const mx = (e.clientX - rect.left - panX) / scale;
    const my = (e.clientY - rect.top - panY) / scale;
    const nx = mx - dragOffX, ny = my - dragOffY;
    positions[dragCard] = { x: nx, y: ny };
    document.querySelector(`.card[data-id="${CSS.escape(dragCard)}"]`).style.left = nx + "px";
    document.querySelector(`.card[data-id="${CSS.escape(dragCard)}"]`).style.top = ny + "px";
    renderEdges();
    updateMinimap();
  }
});

document.addEventListener("mouseup", () => {
  isPanning = false;
  dragCard = null;
  canvasWrap.classList.remove("grabbing");
});

function startCardDrag(e, card, id) {
  e.stopPropagation();
  dragCard = id;
  const rect = canvasWrap.getBoundingClientRect();
  const mx = (e.clientX - rect.left - panX) / scale;
  const my = (e.clientY - rect.top - panY) / scale;
  dragOffX = mx - positions[id].x;
  dragOffY = my - positions[id].y;
}

// ═══════════════════════════════════════════════════════
//  MINIMAP
// ═══════════════════════════════════════════════════════
function updateMinimap() {
  const MW = 180, MH = 120;
  minimapCtx.clearRect(0, 0, MW, MH);

  if (nodes.length === 0) return;
  const xs = nodes.map(n => positions[n.id]?.x || 0);
  const ys = nodes.map(n => positions[n.id]?.y || 0);
  const minX = Math.min(...xs) - 20, maxX = Math.max(...xs) + CARD_W + 20;
  const minY = Math.min(...ys) - 20, maxY = Math.max(...ys) + CARD_H + 20;
  const contentW = maxX - minX, contentH = maxY - minY;
  const scaleX = MW / contentW, scaleY = MH / contentH;
  const ms = Math.min(scaleX, scaleY) * 0.9;

  // Draw edges
  for (const edge of GRAPH.edges) {
    const fp = positions[edge.from], tp = positions[edge.to];
    if (!fp || !tp) continue;
    const color = { import: "#ff5a6e", component: "#3dd68c", function: "#5bb8ff" }[edge.type];
    minimapCtx.beginPath();
    minimapCtx.strokeStyle = color;
    minimapCtx.globalAlpha = 0.3;
    minimapCtx.lineWidth = 0.5;
    minimapCtx.moveTo((fp.x - minX) * ms + 5, (fp.y - minY) * ms + 5);
    minimapCtx.lineTo((tp.x - minX) * ms + 5, (tp.y - minY) * ms + 5);
    minimapCtx.stroke();
  }

  // Draw nodes
  minimapCtx.globalAlpha = 1;
  for (const node of nodes) {
    if (!activeExts.has(node.ext)) continue;
    const p = positions[node.id];
    if (!p) continue;
    const x = (p.x - minX) * ms + 5;
    const y = (p.y - minY) * ms + 5;
    const w = Math.max(CARD_W * ms, 3), h = Math.max(CARD_H * ms, 2);
    const color = EXT_COLORS[node.ext] || "#8b93b0";
    minimapCtx.fillStyle = color + "55";
    minimapCtx.strokeStyle = color + "99";
    minimapCtx.lineWidth = 0.5;
    minimapCtx.beginPath();
    minimapCtx.roundRect(x, y, w, h, 1);
    minimapCtx.fill();
    minimapCtx.stroke();
  }

  // Store minimap transform for viewport
  minimapCtx._minX = minX; minimapCtx._minY = minY; minimapCtx._ms = ms;
  updateMinimapViewport();
}

function updateMinimapViewport() {
  const ms = minimapCtx._ms || 1;
  const minX = minimapCtx._minX || 0, minY = minimapCtx._minY || 0;
  if (!ms) return;
  const ww = canvasWrap.clientWidth, wh = canvasWrap.clientHeight;
  const vx = (-panX / scale - minX) * ms + 5;
  const vy = (-panY / scale - minY) * ms + 5;
  const vw = (ww / scale) * ms;
  const vh = (wh / scale) * ms;
  minimapViewport.style.left = Math.max(0, vx) + "px";
  minimapViewport.style.top = Math.max(0, vy) + "px";
  minimapViewport.style.width = Math.min(vw, 178) + "px";
  minimapViewport.style.height = Math.min(vh, 118) + "px";
}

// ═══════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════
function exportPNG() {
  const cs = getComputedStyle(document.documentElement);
  const html2canvas = () => {
    document.getElementById("status-msg").textContent = "Exporting PNG…";
    setTimeout(() => {
      const rect = canvas.getBoundingClientRect();
      const dataUrl = "data:text/plain,PNG export requires html2canvas library. Save the HTML file and open in browser.";
      document.getElementById("status-msg").textContent = "Use browser Print → Save as PDF or screenshot for now.";
    }, 100);
  };

  // Fallback: serialize SVG
  const svgEl = buildExportSVG();
  const blob = new Blob([svgEl], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "codemap.svg";
  a.click();
  document.getElementById("status-msg").textContent = "Exported SVG";
}

function exportSVG() {
  const svgEl = buildExportSVG();
  const blob = new Blob([svgEl], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "codemap.svg";
  a.click();
  document.getElementById("status-msg").textContent = "Exported SVG ✓";
}

function buildExportSVG() {
  const padding = 60;
  const xs = nodes.map(n => positions[n.id]?.x || 0);
  const ys = nodes.map(n => positions[n.id]?.y || 0);
  const minX = Math.min(...xs) - padding, minY = Math.min(...ys) - padding;
  const maxX = Math.max(...xs) + CARD_W + padding, maxY = Math.max(...ys) + CARD_H + padding;
  const W = maxX - minX, H = maxY - minY;

  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${W} ${H}" width="${W}" height="${H}" style="background:#0d0f14;font-family:Inter,system-ui,sans-serif">`;
  out += `<defs>
    <marker id="a-i" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff5a6e"/></marker>
    <marker id="a-c" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3dd68c"/></marker>
    <marker id="a-f" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5bb8ff"/></marker>
  </defs>`;

  // Edges
  for (const edge of GRAPH.edges) {
    const fp = positions[edge.from], tp = positions[edge.to];
    if (!fp || !tp) continue;
    const x1 = fp.x + CARD_W/2, y1 = fp.y + CARD_H/2;
    const x2 = tp.x + CARD_W/2, y2 = tp.y + CARD_H/2;
    const cx = (x1+x2)/2, cy = (y1+y2)/2-30;
    const color = { import:"#ff5a6e", component:"#3dd68c", function:"#5bb8ff" }[edge.type];
    const mark = { import:"a-i", component:"a-c", function:"a-f" }[edge.type];
    out += `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" stroke="${color}" stroke-width="1.5" fill="none" opacity="0.45" marker-end="url(#${mark})"/>`;
  }

  // Cards
  for (const node of nodes) {
    const p = positions[node.id]; if (!p) continue;
    const color = EXT_COLORS[node.ext] || "#8b93b0";
    out += `<rect x="${p.x}" y="${p.y}" width="${CARD_W}" height="${CARD_H}" rx="10" fill="#13161e" stroke="${node.isOrphan?"#ff9442":node.hasUnusedExports?"#ffca3a":"#2a2f42"}" stroke-width="1"/>`;
    out += `<rect x="${p.x+10}" y="${p.y+10}" width="26" height="26" rx="6" fill="${color}22"/>`;
    out += `<text x="${p.x+23}" y="${p.y+27}" fill="${color}" font-size="9" font-weight="700" text-anchor="middle" font-family="monospace">${node.ext.replace(".","").toUpperCase().slice(0,3)}</text>`;
    out += `<text x="${p.x+44}" y="${p.y+24}" fill="#e2e6f3" font-size="12" font-weight="600">${node.name}</text>`;
    out += `<text x="${p.x+44}" y="${p.y+37}" fill="#555f7a" font-size="10">${node.dir === "." ? "/" : node.dir}</text>`;
    out += `<text x="${p.x+12}" y="${p.y+68}" fill="#555f7a" font-size="10">${node.lines} lines · ${formatSize(node.size)}</text>`;
    if (node.isOrphan) out += `<text x="${p.x+12}" y="${p.y+82}" fill="#ff9442" font-size="9" font-weight="600">⬡ Orphan</text>`;
    if (node.hasUnusedExports) out += `<text x="${p.x+60}" y="${p.y+82}" fill="#ffca3a" font-size="9" font-weight="600">⚠ Dead Export</text>`;
  }

  out += "</svg>";
  return out;
}

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════
function bindEvents() {
  // Search
  document.getElementById("search").addEventListener("input", e => {
    searchQuery = e.target.value;
    applySearchFilter();
  });

  // Layout buttons
  document.querySelectorAll("[data-layout]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-layout]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("status-msg").textContent = "Applying layout…";
      setTimeout(() => {
        applyLayout(btn.dataset.layout);
        renderCards();
        renderEdges();
        fitView();
        updateMinimap();
        document.getElementById("status-msg").textContent = btn.dataset.layout + " layout";
      }, 10);
    });
  });

  // Sidebar toggle
  document.getElementById("btn-sidebar").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
  });

  // Reset view
  document.getElementById("btn-reset").addEventListener("click", () => {
    fitView();
    document.getElementById("status-msg").textContent = "View reset";
  });

  // Export
  document.getElementById("btn-export-png").addEventListener("click", exportPNG);
  document.getElementById("btn-export-svg").addEventListener("click", exportSVG);

  // Canvas click deselect
  canvasWrap.addEventListener("click", e => {
    if (e.target === canvasWrap || e.target === canvas || e.target === svg) {
      focusedId = null;
      expandedId = null;
      clearInspector();
      applyFocusState();
      applySearchFilter();
    }
  });
}

// ═══════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════
window.addEventListener("load", init);
</script>
